name: Build RootHide DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install ldid xz

      - name: Prepare RootHide Theos
        shell: bash
        run: |
          set -euxo pipefail

          # RUNNER_TEMP is a runner-provided environment variable. It cannot be
          # referenced through the `runner` expression context at workflow-level
          # `env`, so resolve it here after the macOS runner has started.
          THEOS_DIR="${RUNNER_TEMP}/theos"
          export THEOS="${THEOS_DIR}"
          echo "THEOS=${THEOS_DIR}" >> "${GITHUB_ENV}"

          rm -rf "${THEOS_DIR}"
          git clone \
            --recursive \
            --depth 1 \
            --shallow-submodules \
            https://github.com/roothide/theos.git \
            "${THEOS_DIR}"

          # This tweak only imports public UIKit/WebKit headers. Reuse the
          # iPhoneOS SDK included with Xcode instead of invoking install-sdk,
          # which otherwise queries api.github.com for patched SDK releases.
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p "${THEOS_DIR}/sdks"
          ln -sfn "${SDK_PATH}" "${THEOS_DIR}/sdks/iPhoneOS${SDK_VERSION}.sdk"

          test -f "${THEOS_DIR}/makefiles/common.mk"
          test -d "${THEOS_DIR}/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "Using RootHide Theos: ${THEOS_DIR}"
          echo "Using iPhoneOS SDK: ${SDK_PATH}"

      - name: Build RootHide package
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${THEOS:-}"
          test -f "${THEOS}/makefiles/common.mk"

          make clean
          make package \
            FINALPACKAGE=1 \
            DEBUG=0 \
            THEOS_PACKAGE_SCHEME=roothide \
            messages=yes

          echo "Generated packages:"
          find packages -maxdepth 1 -type f -name '*.deb' -print
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: ChatGPTSafariFullscreen-RootHide
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
